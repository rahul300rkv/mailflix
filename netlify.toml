[build]
  functions = "netlify/functions"
  publish   = "."

# Groq API proxy
[[redirects]]
  from   = "/api/groq"
  to     = "/.netlify/functions/groq"
  status = 200

# Clean URL rewrites — serves .html file silently (no .html in browser/GSC)
